# AI Detector on a Linux PC with an NVIDIA GPU and the NVIDIA Container Toolkit.
services:
  aidetector:
    image: "ghcr.io/eschouten/ai-detector:latest"
    restart: unless-stopped
    # The host's network, so cameras on it can be found.
    network_mode: host
    environment:
      PORT: 80

    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    volumes:
      - .:/data

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
