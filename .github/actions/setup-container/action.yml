name: Set up container publishing
description: Set up Buildx and authenticate to GitHub Container Registry.
inputs:
  token:
    description: GitHub token with packages write permission
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
