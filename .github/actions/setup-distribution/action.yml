name: Set up distribution toolchain
description: Shared tools for desktop builds and tests; pnpm follows web/package.json.
inputs:
  dotnet:
    description: Install the build/test SDK for the Windows launcher
    default: 'false'
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for name, version in json.loads(Path('distribution/toolchain.json').read_text()).items():
                output.write(f'{name}={version}\n')
        PY
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.versions.outputs.python }}
    - name: Install build dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python -m pip install --requirement distribution/build-requirements.txt
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: web/package.json
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.versions.outputs.bun }}
    - uses: actions/setup-dotnet@v5
      if: inputs.dotnet == 'true'
      with:
        dotnet-version: ${{ steps.versions.outputs.dotnet }}
