name: Repair preview 0.0.11 download URLs

# One-off metadata repair; remove this workflow after the signed feed is verified.
on:
  push:
    tags: ['maintenance/preview-feed-0.0.11']

permissions:
  contents: write

concurrency:
  group: application-preview
  cancel-in-progress: false

jobs:
  repair:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download pinned Sparkle tools
        run: bash distribution/macos/build-launcher.sh "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/mac-launcher"
      - name: Retrieve published metadata and delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download app/test-2026-09-25-11 --pattern appcast.xml --pattern 'AI.Detector0.0.11-0.0.7.delta' --dir repair
          gh release download app/test-2026-09-25-7 --pattern appcast.xml --dir previous
      - name: Correct URLs, verify downloads and sign the repaired feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = 'http://www.andymatuschak.org/xml-namespaces/sparkle'
          signer = str(Path(os.environ['RUNNER_TEMP']) / 'sparkle/bin/sign_update')
          def sign(*arguments):
              subprocess.run([signer, '--ed-key-file', '-', *map(str, arguments)],
                             input=os.environ['SPARKLE_PRIVATE_KEY'], text=True, check=True)
          feed = Path('repair/appcast.xml')
          sign('--verify', feed)
          sign('--verify', 'previous/appcast.xml')
          tree = ET.parse(feed)
          channel = tree.find('channel')
          items = channel.findall('item')
          assert [item.findtext(f'{{{namespace}}}version') for item in items] == ['0.0.11', '0.0.7']
          previous = ET.parse('previous/appcast.xml').find('./channel/item')
          assert previous.findtext(f'{{{namespace}}}version') == '0.0.7'
          channel.remove(items[1])
          channel.append(previous)
          delta = items[0].find(f'./{{{namespace}}}deltas/enclosure')
          delta.set('url', delta.get('url').replace('AI%20Detector', 'AI.Detector'))
          artifact = Path('repair/AI.Detector0.0.11-0.0.7.delta')
          sign('--verify', artifact, delta.get(f'{{{namespace}}}edSignature'))
          for enclosure in tree.findall('.//enclosure'):
              url = enclosure.get('url')
              with urllib.request.urlopen(urllib.request.Request(url, method='HEAD'), timeout=60) as response:
                  assert response.status == 200
                  assert int(response.headers['Content-Length']) == int(enclosure.get('length'))
              print(f'Verified download: {url}')
          ET.register_namespace('sparkle', namespace)
          tree.write(feed, encoding='utf-8', xml_declaration=True)
          sign(feed)
          sign('--verify', feed)
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          artifact.with_suffix('.delta.sha256').write_text(f'{digest}  {artifact.name}\n')
          PY
      - name: Publish repaired signed metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release upload app/test-2026-09-25-11 repair/appcast.xml repair/AI.Detector0.0.11-0.0.7.delta.sha256 --clobber
          gh release upload app-preview-updates repair/appcast.xml --clobber
