name: Set up container publishing
description: Set up Buildx and authenticate to GitHub Container Registry.
inputs:
  token:
    description: GitHub token with packages write permission
    required: true
  minimum-free-gb:
    description: Clean the ephemeral runner only below this free-space budget (0 skips cleanup)
    default: '0'
runs:
  using: composite
  steps:
    - name: Check container build space
      id: disk
      if: inputs.minimum-free-gb != '0'
      shell: bash
      env:
        MINIMUM_FREE_GB: ${{ inputs.minimum-free-gb }}
      run: |
        available=$(df -Pk / | awk 'NR == 2 {print $4}')
        echo "Free disk: $((available / 1024 / 1024)) GiB; build budget: $MINIMUM_FREE_GB GiB"
        if (( available < MINIMUM_FREE_GB * 1024 * 1024 )); then
          echo 'cleanup=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: jlumbroso/free-disk-space@v1.3.1
      if: steps.disk.outputs.cleanup == 'true'
      with:
        tool-cache: true
        docker-images: true
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
