name: Detector Tests

on:
  pull_request:
    paths: &paths
      - "detector/**"
      - "config/**"
      - "example/config.json"
      - "ruff.toml"
      - ".github/workflows/detector-tests.yml"
      - ".github/actions/setup-detector/**"
  push:
    branches:
      - "main"
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: detector-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-detector

      - name: Isolate model-library caches
        shell: bash
        run: |
          echo "YOLO_CONFIG_DIR=$RUNNER_TEMP/yolo" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"

      - name: Ruff
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff check src/aidetector tests

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff format --check src/aidetector tests

      - name: Types
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ty check src/aidetector

      - name: Pytest with branch coverage
        if: runner.os == 'Linux'
        run: uv run --no-sync coverage run -m pytest --junitxml=.reports/tests.xml

      - name: Pytest platform behavior
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest --junitxml=.reports/tests.xml

      - name: Coverage report
        if: runner.os == 'Linux'
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage report
          uv run --no-sync coverage html

      - name: Upload quality reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: detector-quality
          path: detector/.reports/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Schemas
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync generate-schema --check

      - name: Build wheel
        if: matrix.os == 'ubuntu-latest'
        run: uv build --wheel

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detector-test-diagnostics-${{ runner.os }}
          path: detector/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
