name: Desktop distribution tests

on:
  pull_request:
    # UI-only changes still build/test the web server; native packaging is also
    # checked on every preview/release build by application.yml.
    paths: &paths
      - 'distribution/**'
      - 'web/**'
      - '!web/src/**/*.svelte'
      - '!web/src/**/*.css'
      - '!web/tests/**'
      - 'web/tests/fixtures/**'
      - '!web/*.md'
      - 'config/**'
      - 'ruff.toml'
      - 'detector/.python-version'
      - 'detector/pyproject.toml'
      - 'detector/uv.lock'
      - '.github/**'
      - '.gitattributes'
  push:
    branches: ['main']
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: ./.github/workflows/workflow-tests.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
      - name: Compile desktop web executable
        run: python distribution/build.py web --skip-dependencies
      - uses: ./.github/actions/build-launcher
      - uses: ./.github/actions/test-distribution
      - name: Upload distribution diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-diagnostics-${{ runner.os }}
          path: .reports/
          include-hidden-files: true
          retention-days: 7
