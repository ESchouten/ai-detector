name: Web and setup tests

on:
  pull_request:
    paths: ['web/**', 'config/**', 'distribution/**', '.dockerignore', '.github/actions/setup-distribution/**', 'compose.yml', 'example/compose*.yml', 'detector/pyproject.toml', '.github/workflows/web.yml', '.github/workflows/web-tests.yml', '.github/workflows/application.yml']
  push:
    paths: ['web/**', 'config/**', 'distribution/**', '.dockerignore', '.github/actions/setup-distribution/**', 'compose.yml', 'example/compose*.yml', 'detector/pyproject.toml', '.github/workflows/web.yml', '.github/workflows/web-tests.yml', '.github/workflows/application.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm quality && pnpm build && pnpm test:production
        working-directory: web
      - name: Validate Docker Compose deployments
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f example/compose.yml config --quiet
          docker compose -f example/compose.jetson.yml config --quiet
