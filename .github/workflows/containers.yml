name: Container releases

on:
  push:
    tags: ['app/v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Different version tags can update the same latest image.
  group: container-releases
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eschouten/ai-detector

jobs:
  workflows:
    uses: ./.github/workflows/workflow-tests.yml

  detector-checks:
    uses: ./.github/workflows/detector-tests.yml

  web-checks:
    uses: ./.github/workflows/web-tests.yml

  image:
    name: Image / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          minimum-free-gb: '35'
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with: &image-metadata
          images: ${{ env.IMAGE }}
          flavor: latest=${{ github.event_name == 'push' && 'auto' || 'false' }}
          tags: |
            type=semver,pattern={{version}},match=^app/v(.*)$
            type=ref,event=branch
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REF_NAME=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }},mode=max
      - name: Check the container serves setup, has working FFmpeg and can run its detector
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm --entrypoint node --volume "$GITHUB_WORKSPACE/web/tests/container-smoke.mjs:/smoke.mjs:ro" "$IMAGE@$DIGEST" /smoke.mjs
      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Publish image
    needs: [workflows, image, detector-checks, web-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: ./.github/actions/setup-container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with: *image-metadata
      - name: Publish tested manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          arguments=()
          while IFS= read -r tag; do arguments+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do arguments+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${arguments[@]}"
      - name: Inspect published image
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$IMAGE_VERSION"
