name: Web

on:
  push:
    tags:
      - "web/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eschouten/ai-detector-web
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=^web/v(.*)$
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith("web/")) {
            $version = $version.Substring("web/".Length)
          } else {
            $version = $version -replace "/", "-"
          }
          $artifactName = "aidetector-web-windows-$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-distribution

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application
        run: pnpm quality

      - name: Build
        run: python ../distribution/build.py web --platform windows-x64 --skip-dependencies --standalone-web

      - name: Name Executable
        run: |
          Move-Item -Path "dist\ai-detector-web.exe" -Destination "dist\${env:ARTIFACT_NAME}.exe" -Force

      - name: Zip exe
        run: |
          Push-Location dist
          7z a -tzip -mx=1 "${env:ARTIFACT_NAME}.zip" "${env:ARTIFACT_NAME}.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "7z failed with exit code $LASTEXITCODE"
          }
          Pop-Location

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: aidetector-web-windows-${{ steps.version.outputs.version }}-exe
          path: web/dist/aidetector-web-windows-${{ steps.version.outputs.version }}.zip

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web ${{ steps.version.outputs.version }}
          make_latest: false
          files: web/dist/aidetector-web-windows-${{ steps.version.outputs.version }}.zip

  macos-exe:
    name: Build macOS exe
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${version}" == web/* ]]; then
            version="${version#web/}"
          else
            version="${version//\//-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=aidetector-web-osx-${version}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-distribution

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application
        run: pnpm quality

      - name: Build
        run: python ../distribution/build.py web --platform macos-arm64 --skip-dependencies --standalone-web

      - name: Name Executable
        run: |
          mv "dist/ai-detector-web" "dist/${ARTIFACT_NAME}.command"

      - name: Zip Executable
        run: |
          cd dist
          chmod +x "${ARTIFACT_NAME}.command"
          ditto -c -k "${ARTIFACT_NAME}.command" "${ARTIFACT_NAME}.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: aidetector-web-osx-${{ steps.version.outputs.version }}-exe
          path: web/dist/aidetector-web-osx-${{ steps.version.outputs.version }}.zip

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web ${{ steps.version.outputs.version }}
          make_latest: false
          files: web/dist/aidetector-web-osx-${{ steps.version.outputs.version }}.zip
