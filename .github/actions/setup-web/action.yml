name: Set up web toolchain
description: Install the pinned Node, pnpm and Bun versions and locked web dependencies.
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        node - <<'JS'
        const fs = require('node:fs');
        const { node, bun } = require('./distribution/toolchain.json');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${node}\nbun=${bun}\n`);
        JS
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.versions.outputs.bun }}
    - name: Install web dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
