name: Set up web toolchain
description: Install pinned web tools and locked dependencies for builds or runtime tests.
inputs:
  runtime-only:
    description: Install production dependencies without lifecycle scripts or the Bun compiler
    default: 'false'
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        node - <<'JS'
        const fs = require('node:fs');
        const { node, bun } = require('./distribution/toolchain.json');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${node}\nbun=${bun}\n`);
        JS
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - uses: oven-sh/setup-bun@v2
      if: inputs.runtime-only != 'true'
      with:
        bun-version: ${{ steps.versions.outputs.bun }}
    - name: Install web dependencies
      shell: bash
      working-directory: web
      env:
        RUNTIME_ONLY: ${{ inputs.runtime-only }}
      run: |
        if [ "$RUNTIME_ONLY" = true ]; then
          pnpm install --frozen-lockfile --prod --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
