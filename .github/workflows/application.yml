name: Application download

on:
  push:
    tags: ['app/v*', 'app/test-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ startsWith(github.ref, 'refs/tags/app/v') && 'stable' || 'preview' }}
  cancel-in-progress: false

jobs:
  configuration:
    name: Release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      feed_tag: ${{ steps.release.outputs.feed_tag }}
      feed_url: ${{ steps.release.outputs.feed_url }}
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Choose version and update channel
        id: release
        run: python distribution/release_config.py
      - name: Check required secrets and public key
        # Only presence flags reach this job. Keys stay in the signing steps below.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY != '' }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = (
              'SPARKLE_PRIVATE_KEY', 'SPARKLE_PUBLIC_KEY',
          )
          missing = [name for name in required if os.environ[name] != 'true']
          for name in missing:
              kind = 'variable' if name == 'SPARKLE_PUBLIC_KEY' else 'secret'
              print(f'::error::Missing repository {kind}: {name}')
          sys.exit(bool(missing))
          PY

  checks:
    needs: configuration
    uses: ./.github/workflows/web-tests.yml

  image:
    name: Matching NVIDIA image
    needs: [configuration, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: detector
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eschouten/ai-detector:app-${{ github.sha }}
          build-args: REF_NAME=${{ github.ref_name }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application,ignore-error=true

  native:
    name: ${{ matrix.platform }} binaries
    needs: [configuration, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy: &native-platforms
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            suffix: .exe
            detector: aidetector
            installer: '*-setup.exe'
          - platform: macos-arm64
            runner: macos-latest
            suffix: ''
            detector: aidetector.app
            installer: '*.dmg'
          - platform: linux-x64
            runner: ubuntu-22.04
            suffix: ''
            detector: aidetector
            installer: '*.deb'
    defaults:
      run:
        shell: bash
    env: &release-environment
      APP_VERSION: ${{ needs.configuration.outputs.version }}
      UPDATE_FEED: ${{ needs.configuration.outputs.feed_url }}
      RELEASE_URL: ${{ needs.configuration.outputs.release_url }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      YOLO_AUTOINSTALL: 'false'
      ULTRALYTICS_SKIP_REQUIREMENTS_CHECKS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
        with:
          dotnet: ${{ runner.os == 'Windows' && 'true' || 'false' }}
      - name: Build and test Windows launcher
        if: runner.os == 'Windows'
        run: |
          python distribution/build.py launcher --platform '${{ matrix.platform }}' --version "$APP_VERSION" --output "$RUNNER_TEMP"
          dotnet restore distribution/windows/launcher-tests/Launcher.Tests.csproj --locked-mode
          dotnet test distribution/windows/launcher-tests/Launcher.Tests.csproj --no-restore --configuration Release
          dotnet restore distribution/windows/update-tests/Update.Tests.csproj --locked-mode
          dotnet test distribution/windows/update-tests/Update.Tests.csproj --no-restore --configuration Release
      - name: Build detector
        run: python distribution/build.py detector --platform '${{ matrix.platform }}' --version "$GITHUB_REF_NAME"
      - name: Install release signing tools
        run: uv pip install --python detector/.venv --requirement distribution/requirements.txt
      - name: Install desktop launcher test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin desktop-file-utils
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Compile macOS menu bar launcher
        if: runner.os == 'macOS'
        run: python distribution/build.py launcher --platform '${{ matrix.platform }}' --version "$APP_VERSION" --output "$RUNNER_TEMP"
      - name: Check distribution scripts
        env:
          SPARKLE_SDK: ${{ runner.temp }}/sparkle
          WINDOWS_LAUNCHER: ${{ runner.temp }}/windows-launcher
        run: |
          uv run --project detector --no-sync ruff check distribution
          uv run --project detector --no-sync ruff format --check distribution
          uv run --project detector --no-sync python -m unittest discover -s distribution -p 'test_*.py'
          bun test ./web/desktop/host.test.ts
      - name: Smoke test packaged detector
        working-directory: detector
        run: |
          executable="dist/${{ matrix.detector }}/aidetector${{ matrix.suffix }}"
          if [ '${{ runner.os }}' = macOS ]; then executable="dist/${{ matrix.detector }}/Contents/MacOS/aidetector"; fi
          uv run --no-sync python -m tests.support.smoke_package "$executable"
          uv run --no-sync python -m tests.support.smoke_package "$executable" --model-format pt
      - name: Build web executable
        run: python distribution/build.py web --platform '${{ matrix.platform }}' --version "$APP_VERSION" --skip-dependencies
      - name: Test compiled desktop failure paths
        env:
          DESKTOP_WEB_EXECUTABLE: ${{ github.workspace }}/web/dist/ai-detector-web${{ matrix.suffix }}
        run: python -m unittest discover -s distribution -p test_compiled_desktop.py
      - name: Archive tested binaries for packaging
        # Tar preserves executable permissions and macOS framework symlinks.
        run: |
          export COPYFILE_DISABLE=1
          # Git Bash tar needs a POSIX path, not RUNNER_TEMP's Windows drive path.
          runner_temp=$(cd "$RUNNER_TEMP" && pwd)
          ffmpeg=$(cd web && node -p 'require("ffmpeg-static")')
          cp "$ffmpeg" "ffmpeg${{ matrix.suffix }}"
          tar -cf native-build.tar 'detector/dist/${{ matrix.detector }}' "web/dist/ai-detector-web${{ matrix.suffix }}" "ffmpeg${{ matrix.suffix }}"
          if [ '${{ runner.os }}' = macOS ]; then
            tar -rf native-build.tar -C "$runner_temp" mac-launcher sparkle/bin sparkle/Sparkle.framework sparkle/LICENSE
          fi
          if [ '${{ runner.os }}' = Windows ]; then
            tar -rf native-build.tar -C "$runner_temp" windows-launcher
          fi
      - name: Upload tested binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ matrix.platform }}
          path: native-build.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  installers:
    name: ${{ matrix.platform }} installer
    needs: [configuration, native, image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy: *native-platforms
    defaults:
      run:
        shell: bash
    env: *release-environment
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
        with:
          dotnet: ${{ runner.os == 'Windows' && 'true' || 'false' }}
      - name: Install packaging tools
        run: python -m pip install --requirement distribution/requirements.txt
      - name: Restore Windows installer tool
        if: runner.os == 'Windows'
        run: dotnet tool restore
      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin desktop-file-utils
      - name: Download tested binaries
        uses: actions/download-artifact@v7
        with:
          name: native-build-${{ matrix.platform }}
      - name: Restore tested binaries
        run: |
          mkdir native-build
          tar -xf native-build.tar -C native-build
      - name: Assemble application
        run: |
          ffmpeg="native-build/ffmpeg${{ matrix.suffix }}"
          launcher=()
          if [ '${{ runner.os }}' = macOS ]; then launcher=(--mac-launcher "native-build/mac-launcher" --sparkle "native-build/sparkle"); fi
          if [ '${{ runner.os }}' = Windows ]; then launcher=(--windows-launcher "native-build/windows-launcher"); fi
          if [ '${{ runner.os }}' != Linux ]; then
            launcher+=(--update-feed "$UPDATE_FEED")
            launcher+=(--sparkle-public-key "$SPARKLE_PUBLIC_KEY")
          fi
          python distribution/package.py --detector 'native-build/detector/dist/${{ matrix.detector }}' --web "native-build/web/dist/ai-detector-web${{ matrix.suffix }}" --ffmpeg "$ffmpeg" --output application-dist --platform '${{ matrix.platform }}' --version "$APP_VERSION" "${launcher[@]}" --image 'ghcr.io/eschouten/ai-detector@${{ needs.image.outputs.digest }}'
      - name: Ad-hoc sign macOS application
        if: runner.os == 'macOS'
        run: python distribution/sign_macos.py 'application-dist/AI-Detector-macos-arm64/AI Detector.app'
      - name: Smoke test complete download
        run: python distribution/smoke.py 'application-dist/AI-Detector-${{ matrix.platform }}'
      - name: Retrieve previous release for delta generation
        if: runner.os != 'Linux'
        run: python distribution/updates.py prepare --platform '${{ matrix.platform }}' --version "$APP_VERSION" --feed-url "$UPDATE_FEED"
      - name: Build native installer
        run: python distribution/installers.py 'application-dist/AI-Detector-${{ matrix.platform }}' --platform '${{ matrix.platform }}' --version "$APP_VERSION"
      - name: Generate signed Sparkle feed and deltas
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python distribution/updates.py publish --platform macos-arm64 --version "$APP_VERSION" --sparkle "native-build/sparkle" --release-url "$RELEASE_URL"
      - name: Sign Velopack feed and package hashes
        if: runner.os == 'Windows'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python distribution/updates.py publish --platform windows-x64 --version "$APP_VERSION" --release-url "$RELEASE_URL"
      - name: Refresh archives and checksums
        run: |
          python distribution/build.py archive 'application-dist/AI-Detector-${{ matrix.platform }}'
          python - <<'PYARCHIVE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'distribution')
          from package import checksum
          for pattern in ('*.dmg', '*.exe', '*.deb', '*.nupkg', '*.delta'):
              for artifact in Path('application-dist').glob(pattern):
                  checksum(artifact)
          PYARCHIVE
      - name: Upload installer download
        uses: actions/upload-artifact@v7
        with:
          name: AI-Detector-${{ matrix.platform }}
          path: application-dist/${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload supporting release files
        uses: actions/upload-artifact@v7
        with:
          name: release-support-${{ matrix.platform }}
          path: |
            application-dist/*.zip
            application-dist/*.sha256
            application-dist/*.nupkg
            application-dist/*.delta
            application-dist/appcast.xml
            application-dist/releases.win.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: [configuration, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: AI-Detector-*
          path: downloads
          merge-multiple: true
      - name: Download supporting release files
        uses: actions/download-artifact@v7
        with:
          pattern: release-support-*
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.configuration.outputs.tag }}
          # Existing tags already identify the tested commit. Only branch runs create a tag.
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          name: AI Detector ${{ needs.configuration.outputs.version }} (${{ needs.configuration.outputs.channel }})
          prerelease: ${{ needs.configuration.outputs.channel == 'preview' }}
          make_latest: ${{ needs.configuration.outputs.channel == 'stable' }}
          files: downloads/*
          draft: true
          body: |
            Update channel: **${{ needs.configuration.outputs.channel }}**. Installed Mac and Windows applications receive updates only from this channel. Switching channels requires installing that channel's download. Existing previews without an updater need this installer once.

            Install the download for your computer: the Windows setup program, macOS disk image (drag AI Detector to Applications), or Ubuntu desktop package. Open **AI Detector** and follow the setup. Python, the web server and FFmpeg are included.

            Closing the browser leaves monitoring active. Pause explicitly when you want monitoring to stay paused. Desktop startup runs after you sign in; monitoring before login is not promised.

            Updates are authenticated using AI Detector’s own signing key. These downloads have no Windows publisher certificate or Apple notarization; OS warnings or execution restrictions can apply. Supported packaging targets: Windows 11 24H2+ x64, macOS 14+ Apple Silicon, Ubuntu 22.04/24.04 amd64. GPU and camera qualification remains specific to the tested hardware. Portable ZIPs remain available for technical users.
      - name: Publish application before promoting update feeds
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.configuration.outputs.tag }}
          UPDATE_FEED_TAG: ${{ needs.configuration.outputs.feed_tag }}
          UPDATE_CHANNEL: ${{ needs.configuration.outputs.channel }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          if ! gh release view "$UPDATE_FEED_TAG" >/dev/null 2>&1; then
            gh release create "$UPDATE_FEED_TAG" --title "Application $UPDATE_CHANNEL update feeds" --notes "Signed $UPDATE_CHANNEL desktop updater metadata. Installers are attached to versioned application releases." --prerelease --latest=false
          fi
          gh release upload "$UPDATE_FEED_TAG" downloads/appcast.xml downloads/releases.win.json --clobber
