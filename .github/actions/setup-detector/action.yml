name: Set up detector
description: Install uv, the pinned Python and the detector's locked dependencies.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        working-directory: detector
        version-file: pyproject.toml
        enable-cache: true
        # Caches are private to the tag that wrote them; a tag build can only read main's.
        save-cache: ${{ github.ref_type != 'tag' }}
    - name: Install the detector
      shell: bash
      working-directory: detector
      run: |
        uv python install
        uv sync --locked --extra default
