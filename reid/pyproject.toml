[project]
name = "reid"
version = "0.1.0"
description = "Animal re-identification research: embeddings, open-set matching and benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=11",
]

[project.optional-dependencies]
# The embedding networks. PyPI's PyTorch runs on Apple GPUs and NVIDIA CUDA.
models = [
    "torch>=2.6",
    "timm>=1.0.15",
    "safetensors>=0.5",
    # MiewID loads through transformers with the code published beside its weights.
    "transformers>=4.50",
]
# Cutting crops out of labelled videos.
video = [
    "opencv-python>=4.10",
]
# Tracking cows in unlabelled farm video with a stock YOLO model.
tracking = [
    "opencv-python>=4.10",
    "ultralytics>=8.4.80",
    # The trackers' assignment solver, which Ultralytics installs only on first use.
    "lap>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.scripts]
reid = "reid.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reid"]
