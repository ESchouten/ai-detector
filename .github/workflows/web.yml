name: Standalone web releases

on:
  push:
    tags:
      - "web/v*"
  workflow_dispatch:

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eschouten/ai-detector-web
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=^web/v(.*)$
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

  native:
    name: Standalone web / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            label: windows
            executable: ai-detector-web.exe
            suffix: .exe
          - platform: macos-arm64
            runner: macos-latest
            label: osx
            executable: ai-detector-web
            suffix: .command
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
      - name: Name download
        id: version
        env:
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          version="${GITHUB_REF_NAME#web/}"
          version="${version//\//-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=aidetector-web-$PLATFORM_LABEL-$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check web application
        run: pnpm quality
      - name: Build executable
        run: python ../distribution/build.py web --platform '${{ matrix.platform }}' --skip-dependencies --standalone-web
      - name: Package download
        env:
          EXECUTABLE: ${{ matrix.executable }}
          EXECUTABLE_SUFFIX: ${{ matrix.suffix }}
        run: |
          mv "dist/$EXECUTABLE" "dist/$ARTIFACT_NAME$EXECUTABLE_SUFFIX"
          python -m zipfile -c "dist/$ARTIFACT_NAME.zip" "dist/$ARTIFACT_NAME$EXECUTABLE_SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: aidetector-web-${{ matrix.label }}-${{ steps.version.outputs.version }}-exe
          path: web/dist/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish standalone download
        if: startsWith(github.ref, 'refs/tags/web/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web ${{ steps.version.outputs.version }}
          make_latest: false
          files: web/dist/${{ env.ARTIFACT_NAME }}.zip
