# Legacy JetPack 6 installation: this detector image no longer receives updates.
# Keep the existing image on JetPack 6; the generic ARM64 image is not qualified
# for Orin / JetPack 7.2. See detector/MIGRATION.md before upgrading.
services:
  aidetector:
    image: "ghcr.io/eschouten/ai-detector:latest-jetpack6"
    restart: unless-stopped
    command: ["python3", "-m", "aidetector", "--live-preview"]
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - .:/data

  web:
    image: "ghcr.io/eschouten/ai-detector-web:latest"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "80:3000"
    volumes:
      - .:/data
