name: Desktop distribution tests

on:
  pull_request:
    paths: ['distribution/**', 'web/**', 'config/**', 'ruff.toml', '.config/**', '.github/**', '.gitattributes']
  push:
    branches: ['**']
    paths: ['distribution/**', 'web/**', 'config/**', 'ruff.toml', '.config/**', '.github/**', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-preview:
    name: Recover already-tested preview 0.0.7
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Recover signed preview release 0.0.7')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: AI-Detector-macos-arm64
          path: downloads
          run-id: 36129681990
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: AI-Detector-windows-x64
          path: downloads
          run-id: 36129681990
          github-token: ${{ github.token }}
      - name: Verify and publish existing signed packages
        working-directory: downloads
        run: |
          sha256sum --check ./*.sha256
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Update channel: **preview**. Install the Mac disk image or Windows setup program once; later previews arrive through **Check for Updates**. Settings and recordings stay outside the application.

          These are the original signed installers from [the successful platform builds](https://github.com/ESchouten/ai-detector/actions/runs/36129681990). No application files were rebuilt for this publication recovery.

          The Linux package is available in that run's **AI-Detector-linux-x64** artifact. It exceeds GitHub's release asset limit; the next preview will reduce its bundled dependencies.

          Downloads use our own update signing key and have no Apple notarization or Windows publisher certificate. Supported desktop targets: Apple Silicon macOS 14+ and Windows 11 24H2+ x64.
          NOTES
          gh release create app/test-2026-09-25-7 --verify-tag --draft --prerelease --latest=false --title 'AI Detector 0.0.7 (preview)' --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload app/test-2026-09-25-7 ./*
          gh release edit app/test-2026-09-25-7 --draft=false
          gh release create app-preview-updates appcast.xml releases.win.json --prerelease --latest=false --title 'Application preview update feeds' --notes 'Signed preview desktop updater metadata. Installers are attached to versioned application releases.'

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows and embedded shell scripts
        uses: docker://rhysd/actionlint:1.7.12

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-distribution
        with:
          dotnet: 'true'
      - run: pnpm --dir web install --frozen-lockfile
      - run: python -m pip install -r distribution/requirements.txt
      - name: Distribution lint and formatting
        run: |
          uvx --from ruff==0.15.20 ruff check distribution
          uvx --from ruff==0.15.20 ruff format --check distribution
      - name: Desktop TypeScript checks
        run: |
          pnpm --dir web check:desktop
          pnpm --dir web test:desktop
          bun test ./web/desktop/host.test.ts
      - name: Compile desktop web executable
        run: python distribution/build.py web --skip-dependencies
      - name: Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin desktop-file-utils
      - name: Compile Mac launcher
        if: runner.os == 'macOS'
        run: python distribution/build.py launcher --output "$RUNNER_TEMP"
      - name: Build and test Windows launcher
        if: runner.os == 'Windows'
        run: |
          python distribution/build.py launcher --output "$RUNNER_TEMP"
          dotnet restore distribution/windows/launcher-tests/Launcher.Tests.csproj --locked-mode
          dotnet test distribution/windows/launcher-tests/Launcher.Tests.csproj --no-restore --configuration Release
      - name: Portable update recovery tests
        run: |
          dotnet restore distribution/windows/update-tests/Update.Tests.csproj --locked-mode
          dotnet test distribution/windows/update-tests/Update.Tests.csproj --no-restore --configuration Release
      - name: Packaging and process lifecycle tests
        env:
          SPARKLE_SDK: ${{ runner.temp }}/sparkle
          WINDOWS_LAUNCHER: ${{ runner.temp }}/windows-launcher
          DESKTOP_WEB_EXECUTABLE: ${{ github.workspace }}/web/dist/ai-detector-web${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s distribution -p 'test_*.py'
