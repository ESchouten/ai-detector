name: Standalone detector releases

on:
  push:
    tags:
      - "detector/v*"
  workflow_dispatch:

concurrency:
  group: detector-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  UV_PYTHON: "3.11"
  LITELLM_LOCAL_MODEL_COST_MAP: "true"

jobs:
  build:
    name: Detector image / ${{ matrix.variant }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            variant: default
            arm64_base: latest-nvidia-arm64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            variant: default
            arm64_base: latest-nvidia-arm64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            variant: jetpack6
            arm64_base: latest-jetson-jetpack6
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eschouten/ai-detector
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'jetpack6' && '-jetpack6' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=^detector/v(.*)$
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/detector/v') && !contains(github.ref_name, '-') }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: detector
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REF_NAME=${{ github.ref_name }}
            ULTRALYTICS_TAG_ARM64=${{ matrix.arm64_base }}
          outputs: type=image,name=ghcr.io/eschouten/ai-detector,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish detector image / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            suffix: ''
          - variant: jetpack6
            suffix: '-jetpack6'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eschouten/ai-detector
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=^detector/v(.*)$
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/detector/v') && !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          arguments=()
          while IFS= read -r tag; do arguments+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do arguments+=("ghcr.io/eschouten/ai-detector@sha256:$digest"); done
          docker buildx imagetools create "${arguments[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/eschouten/ai-detector:${{ steps.meta.outputs.version }}

  native:
    name: Standalone detector / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ML
            platform: windows-x64
            runner: windows-latest
            type: windowsml
            prefix: aidetector-winml
            suffix: .exe
            upload_suffix: .exe
            cuda_index: ''
            release_asset: true
          - label: Windows CUDA 13.0
            platform: windows-x64
            runner: windows-latest
            type: cuda
            prefix: aidetector-cuda130
            suffix: .exe
            upload_suffix: .exe
            cuda_index: https://download.pytorch.org/whl/cu130
            release_asset: false
          - label: Windows CUDA 12.6
            platform: windows-x64
            runner: windows-latest
            type: cuda
            prefix: aidetector-cuda126
            suffix: .exe
            upload_suffix: .exe
            cuda_index: https://download.pytorch.org/whl/cu126
            release_asset: false
          - label: Mac
            platform: macos-arm64
            runner: macos-latest
            type: default
            prefix: aidetector-osx
            suffix: .command
            upload_suffix: .zip
            cuda_index: ''
            release_asset: true
    defaults:
      run:
        working-directory: detector
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: detector/uv.lock
      - name: Set up Python
        run: uv python install
      - name: Name download
        id: version
        env:
          ARTIFACT_PREFIX: ${{ matrix.prefix }}
        run: |
          version="${GITHUB_REF_NAME#detector/}"
          version="${version//\//-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=$ARTIFACT_PREFIX-$version" >> "$GITHUB_ENV"
      - name: Install CUDA dependencies
        if: matrix.cuda_index != ''
        env:
          CUDA_INDEX: ${{ matrix.cuda_index }}
        run: |
          uv venv --python "$UV_PYTHON"
          uv pip install --pre ".[nvidia]" torch torchvision pyinstaller --index-url "$CUDA_INDEX" --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match
      - name: Build executable
        env:
          PLATFORM: ${{ matrix.platform }}
          DETECTOR_TYPE: ${{ matrix.type }}
          CUDA_INDEX: ${{ matrix.cuda_index }}
        run: |
          name="$ARTIFACT_NAME"
          if [ "$PLATFORM" = macos-arm64 ]; then name+=.command; fi
          arguments=(detector --platform "$PLATFORM" --onefile --name "$name" --type "$DETECTOR_TYPE")
          if [ -n "$CUDA_INDEX" ]; then arguments+=(--skip-dependencies); fi
          python ../distribution/build.py "${arguments[@]}"
      - name: Smoke test executable
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.suffix }}
        run: |
          uv run --no-sync python -m tests.support.smoke_package "dist/$ARTIFACT_NAME$EXECUTABLE_SUFFIX"
          uv run --no-sync python -m tests.support.smoke_package "dist/$ARTIFACT_NAME$EXECUTABLE_SUFFIX" --model-format pt
      - name: Package standalone download
        if: matrix.release_asset
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.suffix }}
        run: python -m zipfile -c "dist/$ARTIFACT_NAME.zip" "dist/$ARTIFACT_NAME$EXECUTABLE_SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.prefix }}-${{ steps.version.outputs.version }}-exe
          path: detector/dist/${{ env.ARTIFACT_NAME }}${{ matrix.upload_suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish standalone download
        if: startsWith(github.ref, 'refs/tags/detector/v') && matrix.release_asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Detector ${{ steps.version.outputs.version }}
          make_latest: false
          files: detector/dist/${{ env.ARTIFACT_NAME }}.zip
